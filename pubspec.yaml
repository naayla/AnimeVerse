name: anime_verse
description:
publish_to:

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/

assets:
  - family: Urbanist
    fonts:
    - assets: assets/fonts/Urbanist-Reguler.ttf
    - assets: assets/fonts/Urbanist-Thin.ttf
      weight: 100
    - assets: assets/Urbanist-Bold.ttf
      weight: 700
    - assets: assets/Urbanist-SemiBold.ttf
      weight: 600
    - assets: assets/Urbanist-Medium.ttf
      weight: 300
    - assets: assets/Urbanist-Light.ttf
      weight: 500
    - assets: assets/Urbanist-ExtraBold.ttf
      weight: 800
